# Reference nukorg/v1 Org capability manifest — lives at `<org>/infra/nuklaut.org.yml`.
# Read by BOTH the core bootstrap (to BUILD the platform) and the deploy plugin
# (to OPERATE it). This is the astrojones shape; see the comments for the variants.
#
# Validate:  nuk org validate nuklaut.org.yml
apiVersion: nukorg/v1
kind: Org
metadata:
  name: astrojones                  # the GitHub org; its config lives at astrojones/infra
domains:                            # every managed domain; each gets a wildcard cert
  - astrojones.guru                 # the platform domain (auth., nuk., traefik.)
  - bitcoinalchemist.com            # an app domain
platformDomain: astrojones.guru     # must be one of domains[]
acmeEmail: admin@astrojones.guru
network:                            # private plan; omit entirely for a lone single host
  cidr: 10.10.0.0/16                # Hetzner Cloud-Network supernet
  cloudSubnet: 10.10.1.0/24         # hcloud VPS subnet
  vswitchSubnet: 10.10.2.0/24       # subnet of type "vSwitch" (couples Robot metal in)
  vswitchVlan: 4001                 # the Robot vSwitch VLAN id
hosts:                              # one entry per machine or VM; addressed by privateIp
  - { name: hcbase,         provider: hcloud,  type: cx23, role: edge,       privateIp: 10.10.1.2 }
  - { name: controller,     provider: hcloud,  type: cx33, role: worker,     privateIp: 10.10.1.3 }
  - { name: nuroot-metal,   provider: manual,  ip: 1.2.3.4, role: hypervisor, privateIp: 10.10.2.2 }
  - { name: nuroot-db,      provider: libvirt, metal: nuroot-metal, vcpu: 4, memory: 16G, role: data,   privateIp: 10.10.2.3 }
  - { name: nuroot-compute, provider: libvirt, metal: nuroot-metal, vcpu: 8, memory: 32G, role: worker, privateIp: 10.10.2.4 }
facilities:
  dns: wildcard                     # wildcard | manual   (manual pairs with tls: http01)
  tls: dns01                        # dns01 | http01      (wildcard requires dns01)
  dnsProvider: hetzner              # required when tls: dns01
  secrets: sops                     # sops | generate | ci-inject
  auth: authentik                   # basic | oauth2-proxy | authentik
  runners: ephemeral                # ephemeral | persistent
mesh: tailscale                     # tailscale | none    (none only for a single host)
overlays: [host-tooling-claude]     # host-specific add-on dirs sourced by bootstrap.sh
