# Reference nukorg/v1 Org capability manifest — lives at `<org>/infra/nuklaut.org.yml`.
# Read by BOTH the core bootstrap (to BUILD the platform) and the deploy plugin
# (to OPERATE it). This is the astrojones shape; see the comments for the variants.
apiVersion: nukorg/v1
kind: Org
metadata:
  name: astrojones                  # the GitHub org; its config lives at astrojones/infra
domain: astrojones.de
acmeEmail: admin@astrojones.de
controller:
  hostname: astrojones-controller
  provisioner: terraform            # terraform | manual | ansible
  deployMode: ssh                   # ssh | local  (local = run deploy on the controller itself)
facilities:
  dns: wildcard                     # wildcard | manual
  tls: dns01                        # dns01 | http01   (wildcard requires dns01)
  dnsProvider: hetzner              # required when tls: dns01
  secrets: sops                     # sops | generate | ci-inject
  auth: oauth2-proxy                # basic | oauth2-proxy | authentik
  runners: ephemeral                # ephemeral | persistent
  data:
    postgres: true
    redis: true
overlays: []                        # host-specific add-on dirs, e.g. [strongswan-vpn, cifs-mount]
pins:
  core: astrojones/nuklaut@v1.0.0   # pinned generic core (release-tag) — bump = reviewable PR
  nuk: astrojones/nuk@v0.9.0
