# Dependabot version updates. Alerts and security updates are already enabled
# org-wide (org default for new repos + per repo for the existing ones); this
# file adds the routine weekly version bumps.
#
# nuk is a uv project: the `uv` ecosystem reads pyproject.toml AND uv.lock, which
# the `pip` ecosystem it replaces never saw.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-packages:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
