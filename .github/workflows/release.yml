name: release

# No-PR release: on push to main, the shared workflow derives the next version
# from conventional commits, stamps it into nuk.py + pyproject.toml, commits that
# to main ([skip ci]), and creates the tag + GitHub release — no PR.
#
# We no longer ship a built binary: nuk is installed/updated straight from this
# git repo (`uv tool install --from git+... nuk@<tag>` / `nuk update`), so the tag
# + GitHub Release created here is the only artifact `nuk update` needs to resolve
# "latest". There is no build/deploy job — see README "Releasing".

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    uses: astrojones/.github/.github/workflows/release.yml@main
    secrets: inherit
    with:
      # The reusable workflow defaults to '["self-hosted","nuklaut"]' to keep
      # GitHub-hosted minutes off private repos. Overridden here on purpose: version
      # stamping and tag creation touch no astrojones infrastructure, and pinning them
      # to the controller runner means a release cannot happen while that box is down —
      # which is exactly the state the 2026-07-21 migration put the fleet in (checked:
      # ONE runner org-wide, offline, and nothing carrying the `nuklaut` label).
      # Trade accepted: a couple of GitHub-hosted minutes per release.
      runs-on: '["ubuntu-latest"]'
      version-files: |
        nuk.py
        pyproject.toml
