name: release

# Push a vX.Y.Z tag -> build the nuk.pyz zipapp and attach it to a GitHub
# release. PyYAML is intentionally NOT bundled: the nuklaut controller host and
# the CI runner image both ship python3 + python3-yaml, so the zipapp stays a
# tiny single file. The controller pins a release via NUK_VERSION.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zipapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The git tag is the single source of truth for the version. Stamp it into
      # nuk.py's __version__ (what `nuk --version` prints) and pyproject.toml at
      # build time, so a release can never disagree with its tag — no manual bump,
      # no drift. The repo keeps a dev-placeholder __version__; only releases are
      # authoritative.
      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import re, sys, pathlib
          v = sys.argv[1]
          nuk = pathlib.Path("nuk.py"); s = nuk.read_text()
          s, n = re.subn(r'^(__version__ = )"[^"]*"', rf'\g<1>"{v}"', s, flags=re.M)
          assert n == 1, f"nuk.py: expected 1 __version__ line, patched {n}"
          nuk.write_text(s)
          pp = pathlib.Path("pyproject.toml"); t = pp.read_text()
          t, n = re.subn(r'^version = ".*"$', f'version = "{v}"', t, count=1, flags=re.M)
          assert n == 1, f"pyproject.toml: expected 1 version line, patched {n}"
          pp.write_text(t)
          print(f"stamped version {v}")
          PY

      - name: Build nuk.pyz
        run: |
          mkdir -p build/src
          cp nuk.py build/src/
          python3 -m zipapp build/src -m "nuk:main" -p "/usr/bin/env python3" -o nuk.pyz
      - name: Smoke test (PyYAML available, mirrors the controller)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 nuk.pyz --help
          # The built artifact must report exactly its tag — proves the stamp took.
          got="$(python3 nuk.pyz --version)"
          want="nuk ${GITHUB_REF_NAME#v}"
          [ "$got" = "$want" ] || { echo "::error::version mismatch: got '$got', want '$want'"; exit 1; }
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nuk.pyz \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" nuk.pyz --clobber
