name: release

# release-please drives versioning from conventional commits on main: it opens a
# release PR (bumping nuk.py's __version__, pyproject.toml, and CHANGELOG) that
# auto-merges once `ci` is green, then creates the tag + GitHub release.
#
# When a release is created, we build the nuk.pyz zipapp in the SAME run and
# attach it to that release, then dispatch the controller deploy. Folding the
# build into the release_created path (rather than a separate `on: push: tags`
# workflow) sidesteps the GITHUB_TOKEN recursion guard — a release created by the
# built-in token does not emit a tag/release event that would trigger other
# workflows. The artifact is built with shiv, which bundles nuk's runtime deps
# (pydantic/typer/pyyaml) into the pyz — pydantic-core is a native wheel a plain
# `python -m zipapp` can't load. Build under python 3.13 to match the controller
# ABI (pydantic-core ships per-ABI wheels).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: astrojones/.github/.github/workflows/release-please.yml@main
    secrets: inherit

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # dispatch deploy.yml
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build nuk.pyz
        run: |
          python3 -m pip install --quiet shiv
          shiv -c nuk -o nuk.pyz . -p "/usr/bin/env python3"

      - name: Smoke test (self-contained; no deps installed alongside)
        run: |
          # No `pip install`: shiv bundled every runtime dep into the pyz.
          python3 nuk.pyz --help
          # release-please set nuk.py's __version__ and the tag together, so the
          # built artifact must report exactly its tag.
          got="$(python3 nuk.pyz --version)"
          want="nuk ${TAG#v}"
          [ "$got" = "$want" ] || { echo "::error::version mismatch: got '$got', want '$want'"; exit 1; }

      - name: Attach nuk.pyz to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" nuk.pyz --clobber

      - name: Deploy to the controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml -f tag="$TAG"
