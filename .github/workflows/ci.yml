name: ci

# Inlined from astrojones/.github's reusable ci.yml (python path, same pins).
# nuk is a bartixcloud platform repo: its CI must not depend on a tenant org's
# workflows or runners (that one hard-codes [self-hosted, nuklaut]).
# Runs on an ephemeral runner from our runner-broker (tenant bartixcloud, tier
# build). Exactly [self-hosted, build]: any extra label is denied by the broker.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # nuk is a PUBLIC repo on self-hosted runners: never hand a fork PR (untrusted
    # code) a broker build VM. Same-repo PRs and push-to-main only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, build]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"   # matches requires-python>=3.13
          version: "0.13.1"        # pinned: uv.lock's revision field is version-sensitive

      # The release workflow re-locks uv.lock after stamping a version, because the
      # shared workflow tags before a caller can re-lock. Guard the invariant from the
      # other side too: a pyproject.toml change that forgets `uv lock` should fail here
      # rather than be silently rewritten by the `uv sync` below.
      - name: uv.lock is up to date
        run: uv lock --check

      - name: Ruff lint
        run: uvx ruff@0.15.15 check .

      - name: Pytest
        run: |
          set -euo pipefail
          uv sync --all-extras --dev 2>/dev/null || uv sync 2>/dev/null || true
          uv run pytest -q
