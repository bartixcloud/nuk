name: integration

# DB-integration tier (issue #9): exercises the real SQL / redis-CLI execution
# behind provision_databases / purge_databases against a throwaway copy of the
# vendored shared data stack (files/docker-compose.data.yml), including issue
# #10's preflight and issue #8's non-ingress injection.
#
# Modelled on the org's migration-shadow-check / ephemeral-runner pattern (a CI
# job with real Docker that brings DBs up and tears them down on exit), and runs
# on the broker's ephemeral build tier ON PURPOSE: the stack uses the FIXED
# container names nuk-postgres / nuk-redis, which would collide with — and could
# disrupt — a LIVE data stack on any host that runs the platform. A throwaway
# runner-broker VM (one VM per job, own Docker daemon) gives the same real Docker
# in full isolation. The data stack is torn down by the test fixture's finally
# block (docker compose down -v).
#
# The default reusable CI (ci.yml) runs the fast unit suite only; this tier is
# opt-in via NUK_INTEGRATION (tests/conftest.py skips it otherwise).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    # A fork PR must never reach a broker build VM (arbitrary code on the fleet's
    # network): same-repo PRs and push-to-main only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # ⚠ MUST NOT be a self-hosted runner that shares a host with the live data stack:
    #   with the unfiltered `on: pull_request` above and the fixture's
    #   `docker compose down -v`, any pull request would bring up the fixed-name
    #   nuk-postgres / nuk-redis there and then delete the LIVE data volumes. The
    #   `build` tier is an ephemeral VM per job, never a host that runs the platform.
    runs-on: [self-hosted, build]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: DB integration tier (real postgres + redis)
        env:
          NUK_INTEGRATION: "1"
          POSTGRES_PASSWORD: ci-postgres
          REDIS_ADMIN_PASSWORD: ci-redis
        run: |
          set -euo pipefail
          uv sync --all-extras --dev
          uv run pytest -m integration
