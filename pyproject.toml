[project]
name = "nuk"
version = "2.8.0"
description = "Minimal Kubernetes-shaped Docker Compose deployer (nuklaut controller CLI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9", "typer>=0.15", "pyyaml>=6"]

[project.scripts]
nuk = "nuk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# nuk is a flat package (NOT a src/ layout): release-please bumps __version__ in
# nuk/__init__.py via the x-release-please-version marker, the script entry is
# nuk:main, and tests `import nuk` with pythonpath=["."].
[tool.hatch.build.targets.wheel]
packages = ["nuk"]

[tool.hatch.build.targets.sdist]
include = ["nuk", "tests", "README.md"]

[dependency-groups]
dev = ["ty", "pytest", "pytest-cov", "pytest-asyncio", "ruff", "pre-commit"]

[tool.ruff]
line-length = 100                 # VARIANT: lean project, code wrapped at 100
target-version = "py313"
src = ["src", "tests"]
exclude = [".git", ".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
preview = true
select = [
    "E","W","F","I","TID","TCH","BLE","TRY","EM","RSE","N","UP","B","A","C4",
    "C901","SIM","RUF","PL","PIE","PERF","FURB","RET","DTZ","ANN401","FIX",
    "ERA","T10","PTH","LOG","G","PT","D","S","FLY","ARG","PGH003","PGH004",
]
ignore = [
    "PLC0415", # import-outside-top-level — needed for circular-import workarounds, lazy loading
    "RUF100",  # unused-noqa — false positives across plugin versions
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-statements = 50
max-branches = 12
max-returns = 6
max-nested-blocks = 5

[tool.ruff.lint.per-file-ignores]
"nuk/__init__.py" = [
    # RUF067 (module split, in progress): __init__ still holds the code being
    # extracted into nuk/*.py. Drop this ignore once it is re-exports only.
    "RUF067",
]
"tests/**/*.py" = [
    # D205: existing terse test docstrings use a one-line summary directly
    # followed by detail (no blank line) — test-only formatting, not worth
    # reflowing the unmodified regression docstrings.
    "S101","TID251","PLR2004","PLR6301","D100","D102","D103","D104","D205","S","ARG",
    "ERA001","PLC","SIM","TRY","RET","RUF029","PT",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-pytest-style]
raises-extend-require-match-for = [
    "pydantic.ValidationError",
    "pydantic_core._pydantic_core.ValidationError",
    "AttributeError",
    "FileNotFoundError",
    "asyncio.CancelledError",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.13"

# Type-check the product module, not the tests: the frozen wire-contract tests
# deliberately pass None / subscript dict|None returns (patterns we may not edit,
# and we may not widen the wire signatures to satisfy). Mirrors the wholesale
# looser ruff regime already applied to tests/** via per-file-ignores.
[tool.ty.src]
exclude = ["tests/**"]

[tool.ty.rules]
unresolved-import = "error"
unresolved-reference = "error"
invalid-assignment = "error"

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v","--strict-markers","--cov=nuk","--cov-report=term-missing"]
markers = [
    "integration: real-container postgres+redis provisioning/purge tier; opt in with NUK_INTEGRATION=1 (needs docker). Skipped by the default unit run.",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["nuk"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
